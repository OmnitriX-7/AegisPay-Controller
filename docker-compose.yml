services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: razorpay-buildathon-app:latest
    container_name: aegispay-controller
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./data/aegispay.db
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./sample_data:/app/sample_data
      - aegispay_data:/app/data
      - aegispay_logs:/app/data/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Prometheus Telemetry Scraper
  prometheus:
    image: prom/prometheus:latest
    container_name: aegispay-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  # Loki Log Aggregator
  loki:
    image: grafana/loki:latest
    container_name: aegispay-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  # Promtail Log Shipper
  promtail:
    image: grafana/promtail:latest
    container_name: aegispay-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - aegispay_logs:/var/log/aegispay:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # Grafana Visual Monitoring Portal (Unified Metrics & Logs)
  grafana:
    image: grafana/grafana:latest
    container_name: aegispay-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

volumes:
  aegispay_data:
  aegispay_logs:
  loki_data:
