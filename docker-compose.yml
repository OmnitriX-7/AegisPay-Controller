services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: razorpay-buildathon-app:latest
    container_name: aegispay-controller
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./data/aegispay.db
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - aegispay_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional Prometheus & Grafana Monitoring Stack
  # Run with: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:latest
    container_name: aegispay-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: aegispay-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

volumes:
  aegispay_data:
